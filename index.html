<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어장 테스트지 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0ede8;
    --surface: #faf8f5;
    --border: #d6d0c8;
    --text: #1a1714;
    --muted: #7a7268;
    --accent: #2d5a27;
    --accent2: #1a3a7a;
    --accent3: #8a3a00;
    --accent4: #6b2080;
    --danger: #8a1a1a;
    --ink: #1a1714;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--ink);
    color: #f0ede8;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 3px solid var(--accent);
  }
  .header-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .header-sub { font-size: 12px; color: #a09888; font-family: 'DM Mono', monospace; }

  /* ── LAYOUT ── */
  .app { display: grid; grid-template-columns: 200px 420px 1fr; height: calc(100vh - 69px); }

  /* ── SAVED LIST PANEL ── */
  .saved-panel {
    background: #13120f;
    border-right: 1px solid #2a2720;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #e0dbd3;
  }
  .saved-panel-title {
    padding: 14px 14px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #6a6458;
    font-family: 'DM Mono', monospace;
    border-bottom: 1px solid #2a2720;
  }
  .saved-list { flex: 1; overflow-y: auto; padding: 6px; }
  .folder-item { margin-bottom: 2px; }
  .folder-header {
    display: flex; align-items: center; gap: 5px;
    padding: 7px 8px; border-radius: 6px; cursor: pointer;
    transition: background 0.15s; border: 1px solid transparent;
  }
  .folder-header:hover { background: #1e1c18; }
  .folder-arrow { font-size: 9px; color: #5a5450; transition: transform 0.2s; flex-shrink:0; }
  .folder-arrow.open { transform: rotate(90deg); }
  .folder-icon { font-size: 12px; flex-shrink:0; }
  .folder-name {
    font-size: 11px; font-weight: 800; color: #b0a898; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .folder-count { font-size: 10px; color: #4a4840; font-family: 'DM Mono', monospace; flex-shrink:0; }
  .folder-del {
    background: transparent; border: none; color: #3a3830;
    cursor: pointer; font-size: 11px; padding: 0 2px; transition: color 0.15s; flex-shrink:0;
  }
  .folder-del:hover { color: #cc4444; }
  .folder-children {
    margin-left: 12px; border-left: 1px solid #2a2720;
    padding-left: 4px; display: none;
  }
  .folder-children.open { display: block; }
  .saved-item {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    transition: background 0.15s; margin-bottom: 1px; border: 1px solid transparent;
  }
  .saved-item:hover { background: #1e1c18; }
  .saved-item.active { background: #222018; border-color: #3a3730; }
  .saved-item-day { font-size: 12px; font-weight: 800; color: #e0dbd3; flex: 1; }
  .saved-item-count { font-size: 10px; color: #5a5450; font-family: 'DM Mono', monospace; flex-shrink:0; }
  .saved-item-del {
    background: transparent; border: none; color: #3a3830;
    cursor: pointer; font-size: 11px; padding: 0; transition: color 0.15s; flex-shrink: 0;
  }
  .saved-item-del:hover { color: #cc4444; }
  .saved-new-btn {
    margin: 6px 8px 8px; padding: 9px; background: transparent;
    border: 1px dashed #2a2720; border-radius: 7px; color: #5a5450;
    font-family: 'Pretendard', sans-serif; font-size: 12px;
    cursor: pointer; transition: all 0.15s; text-align: center; width: calc(100% - 16px);
  }
  .saved-new-btn:hover { border-color: #5a5850; color: #a0988e; background: #1a1816; }
  .saved-empty { padding: 24px 12px; text-align: center; color: #4a4840; font-size: 12px; line-height: 1.7; }

  /* ── LEFT PANEL ── */
  .left-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .panel-section:last-child { border-bottom: none; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-family: 'DM Mono', monospace;
  }

  /* 로고 업로드 */
  .logo-upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
    position: relative;
  }
  .logo-upload-area:hover { border-color: var(--accent); background: #e8f0e7; }
  .logo-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .logo-preview { max-height: 60px; max-width: 200px; object-fit: contain; display: none; margin: 0 auto; }
  .logo-placeholder { color: var(--muted); font-size: 12px; }
  .logo-placeholder span { display: block; font-size: 22px; margin-bottom: 4px; }

  /* 설정 */
  .setting-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .setting-row label { font-size: 12px; color: var(--muted); width: 80px; flex-shrink: 0; }
  .setting-row input[type="text"] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .setting-row input[type="number"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .setting-row input[type="number"]:focus { border-color: var(--accent); }
  .setting-row input[type="number"]::-webkit-inner-spin-button { opacity: 1; }

  /* 단어 테이블 */
  .word-table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 20px;
  }
  .word-table-header {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 32px;
    gap: 6px;
    padding: 8px 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .word-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 32px;
    gap: 6px;
    margin-bottom: 5px;
    align-items: center;
  }
  .word-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding-top: 2px;
  }
  .word-input {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .word-input:focus { border-color: var(--accent); background: #fff; }
  .del-btn {
    width: 26px; height: 26px;
    border: none; border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .del-btn:hover { background: #fce8e8; color: var(--danger); }

  .add-row-btn {
    width: 100%;
    padding: 9px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); background: #e8f0e7; }

  /* 생성 버튼 */
  .gen-buttons {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
  }
  .gen-btn {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 10px;
    color: #fff;
  }
  .gen-btn:active { transform: scale(0.98); }
  .gen-btn-a { background: var(--accent2); }
  .gen-btn-a:hover { background: #1030a0; }
  .gen-btn-b { background: var(--accent3); }
  .gen-btn-b:hover { background: #a04800; }
  .gen-btn-c { background: var(--accent4); }
  .gen-btn-c:hover { background: #7a28a0; }
  .gen-btn-icon { font-size: 16px; }
  .gen-btn-desc { font-size: 10px; font-weight: 400; opacity: 0.85; margin-top: 1px; }

  /* ── RIGHT PANEL (미리보기) ── */
  .right-panel {
    background: #e8e5e0;
    overflow-y: auto;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .preview-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
    gap: 12px;
  }
  .preview-placeholder .icon { font-size: 48px; opacity: 0.4; }
  .preview-placeholder p { font-size: 14px; }

  /* 인쇄 툴바 */
  .print-toolbar {
    display: none;
    width: 780px;
    max-width: 100%;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .print-toolbar.visible { display: flex; }
  .print-btn {
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .print-btn-main { background: var(--ink); color: #fff; }
  .print-btn-main:hover { background: #333; }
  .print-btn-answer { background: #2d5a27; color: #fff; }
  .print-btn-answer:hover { background: #1e3d1a; }
  .print-btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .print-btn-clear:hover { background: #fce8e8; color: var(--danger); border-color: var(--danger); }
  .print-info { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-left: auto; font-family: 'DM Mono', monospace; }

  /* ── A4 시트 ── */
  .sheet-wrap { margin-bottom: 24px; }
  .sheet-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
    width: 780px;
    max-width: 100%;
  }

  .a4-sheet {
    width: 780px;
    min-height: 1102px;
    background: #ffffff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    padding: 48px 56px;
    position: relative;
  }

  /* 시트 헤더 */
  .sheet-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--ink);
  }
  .sheet-header-left { display: flex; flex-direction: column; gap: 4px; }
  .sheet-logo { max-height: 50px; max-width: 160px; object-fit: contain; display: none; }
  .sheet-academy { font-size: 13px; font-weight: 700; color: #555; letter-spacing: 0.5px; }
  .sheet-title { font-size: 24px; font-weight: 900; color: var(--ink); letter-spacing: -0.5px; line-height: 1.2; }
  .sheet-subtitle { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .sheet-meta { text-align: right; }
  .sheet-meta-row { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .sheet-meta-row span { display: inline-block; width: 120px; border-bottom: 1px solid #ccc; }

  /* 테이블 */
  .word-sheet-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .word-sheet-table th {
    background: #111111;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 9px 12px;
    text-align: left;
    font-family: 'DM Mono', monospace;
  }
  .word-sheet-table th:first-child { width: 44px; text-align: center; border-radius: 0; border-right: 1.5px solid #444; }
  .word-sheet-table th:nth-child(2),
  .word-sheet-table td:nth-child(2) { width: 50%; }
  .word-sheet-table th:nth-child(3),
  .word-sheet-table td:nth-child(3) { width: 50%; }
  .word-sheet-table td {
    padding: 9px 12px;
    font-size: 13px;
    border-bottom: 1px solid #e8e5e0;
    vertical-align: middle;
  }
  .word-sheet-table td.col-divider {
    border-right: 1.5px solid #cccccc;
  }
  .word-sheet-table td:first-child { text-align: center; color: var(--muted); font-size: 11px; font-family: 'DM Mono', monospace; border-right: 1.5px solid #cccccc; }
  .word-sheet-table tr:nth-child(even) td { background: #f8f6f3; }
  .word-sheet-table td.answer { color: #111111; font-weight: 700; }
  .write-line { display: none; }

  /* 답지 강조 */
  .answer-badge {
    display: inline-block;
    background: #111111;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
    font-family: 'DM Mono', monospace;
  }

  /* 혼합 유형 뱃지 */
  .type-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
  }
  .type-eng { background: #dce8ff; color: #1a3a7a; }
  .type-kor { background: #ffe8d0; color: #8a3a00; }

  /* ── 인쇄 스타일 ── */
  @page {
    margin: 15mm 16mm;
    size: A4;
  }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .word-sheet-table td, .word-sheet-table th { border-color: #aaaaaa !important; }
    .word-sheet-table td:first-child, .word-sheet-table th:first-child { border-right: 1.5px solid #aaaaaa !important; }
    .word-sheet-table td.col-divider { border-right: 1.5px solid #aaaaaa !important; }
    html, body { margin: 0 !important; padding: 0 !important; }
    body { background: white; }
    .app { display: block; height: auto; }
    .left-panel, .saved-panel, .print-toolbar, .sheet-label, .header { display: none !important; }
    .right-panel { background: white; padding: 0; display: block; }
    .sheet-wrap { margin-bottom: 0; page-break-after: always; }
    .sheet-wrap:last-child { page-break-after: avoid; }
    .a4-sheet {
      width: 100%;
      min-height: auto;
      box-shadow: none;
      padding: 0;
    }
    .preview-placeholder { display: none; }
    .preview-placeholder { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">단어장 테스트지 생성기</div>
    <div class="header-sub">VOCABULARY TEST GENERATOR</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
    <span id="syncStatus" style="font-size:12px;color:#6a6458;font-family:'DM Mono',monospace;">☁️ 로딩 중...</span>
    <button onclick="cloudLoad().then(()=>{renderSavedList();renderBookTags();})" style="padding:6px 14px;background:transparent;border:1px solid #3a3730;border-radius:6px;color:#a09888;font-family:'Pretendard',sans-serif;font-size:12px;font-weight:700;cursor:pointer;" title="클라우드에서 불러오기">↓ 불러오기</button>
    <button onclick="cloudSave(getCloudData())" style="padding:6px 14px;background:#2d5a27;border:none;border-radius:6px;color:#fff;font-family:'Pretendard',sans-serif;font-size:12px;font-weight:700;cursor:pointer;" title="클라우드에 저장">↑ 클라우드 저장</button>
  </div>
</div>

<div class="app">

  <!-- ── SAVED LIST PANEL ── -->
  <div class="saved-panel">
    <div class="saved-panel-title">저장된 단어장</div>
    <div class="saved-list" id="savedList">
      <div class="saved-empty" id="savedEmpty">저장된 단어장이<br>없습니다</div>
    </div>
    <button class="saved-new-btn" onclick="newWordList()">＋ 새 단어장</button>
  </div>

  <!-- ── LEFT PANEL ── -->
  <div class="left-panel">

    <!-- 학원 정보 -->
    <div class="panel-section">
      <div class="section-label" style="display:flex;justify-content:space-between;align-items:center">
        <span>학원 정보</span>
        <button id="editInfoBtn" onclick="toggleEditMode()" style="display:none;font-size:11px;font-weight:700;background:transparent;border:1px solid var(--border);border-radius:5px;padding:3px 10px;cursor:pointer;color:var(--muted);font-family:'Pretendard',sans-serif">✏️ 편집</button>
      </div>

      <!-- 등록 완료 뷰 -->
      <div id="infoRegistered" style="display:none;align-items:center;gap:14px;background:var(--bg);border-radius:8px;padding:12px 14px;border:1px solid var(--border)">
        <img id="logoRegistered" style="max-height:44px;max-width:120px;object-fit:contain" alt="로고">
        <div>
          <div id="academyRegisteredName" style="font-size:15px;font-weight:900;color:var(--text)"></div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace">편집 버튼으로 수정 가능</div>
        </div>
      </div>

      <!-- 편집 뷰 -->
      <div id="infoEdit">
        <div class="logo-upload-area" id="logoUploadArea" onclick="document.getElementById('logoInput').click()">
          <input type="file" id="logoInput" accept="image/*" onchange="handleLogo(event)" style="display:none">
          <img id="logoPreview" class="logo-preview" alt="로고">
          <div class="logo-placeholder" id="logoPlaceholder">
            <span>🏫</span>로고 이미지 클릭하여 업로드
          </div>
        </div>
        <div class="setting-row" style="margin-top:12px">
          <label>학원명</label>
          <input type="text" id="academyName" placeholder="예) 배움트리" value="">
        </div>
        <button onclick="saveInfo()" style="width:100%;margin-top:6px;padding:9px;background:var(--ink);color:#fff;border:none;border-radius:7px;font-family:'Pretendard',sans-serif;font-size:13px;font-weight:700;cursor:pointer">저장</button>
      </div>

      <div class="setting-row" style="margin-top:12px">
        <label>교재명</label>
        <div style="flex:1;display:flex;gap:6px;align-items:center">
          <input type="text" id="bookName" list="bookList" placeholder="교재명 입력 또는 선택" style="flex:1;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:'Pretendard',sans-serif;font-size:13px;background:var(--bg);color:var(--text);outline:none" oninput="onBookInput()" onchange="onBookChange()">
          <datalist id="bookList"></datalist>
          <button onclick="saveBookName()" title="교재명 저장" style="padding:6px 10px;background:var(--ink);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:'Pretendard',sans-serif">저장</button>
        </div>
      </div>
      <div id="savedBookTags" style="display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px 0;padding:0 0 0 0"></div>
      <div class="setting-row">
        <label>DAY</label>
        <div style="display:flex;align-items:center;gap:8px;flex:1">
          <span style="font-weight:700;font-size:14px;color:var(--text);letter-spacing:0.5px">DAY</span>
          <input type="number" id="unitName" placeholder="1" min="1" style="width:80px;flex:none;text-align:center">

    <!-- 단어 입력 -->
    <div class="panel-section" style="padding-bottom:8px">
      <div class="section-label" style="display:flex;justify-content:space-between;align-items:center">
        <span>단어 입력 <span id="wordCount" style="color:var(--accent);font-weight:900">0</span>개</span>
        <button onclick="saveWordList()" style="font-size:11px;font-weight:700;background:var(--ink);border:none;border-radius:5px;padding:4px 12px;cursor:pointer;color:#fff;font-family:'Pretendard',sans-serif">💾 저장</button>
      </div>
      <div id="dropZone" onclick="document.getElementById('fileInput').click()"
        style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;background:#f0ede8;border:1.5px dashed #b0a898;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;color:#7a7268;font-family:'Pretendard',sans-serif;margin-bottom:8px;transition:all 0.2s;box-sizing:border-box">
        <span id="dropZoneText">📂 클릭하거나 파일을 여기에 드래그 (.docx / .xlsx / .txt)</span>
        <input type="file" id="fileInput" accept=".txt,.docx,.xlsx,.xls" style="display:none" onchange="handleFileInput(event)">

      <div class="word-table-header">

    <div class="word-table-wrap" id="wordTableWrap">
      <!-- 단어 행 동적 생성 -->
      <button class="add-row-btn" onclick="addRow()">＋ 단어 추가</button>
    </div>

    <!-- 생성 버튼 -->
    <div class="gen-buttons">
      <button class="gen-btn gen-btn-a" onclick="generate('A')">
        <span class="gen-btn-icon">📝</span>
        <div>
          <div>영어 → 한글 뜻 쓰기</div>
          <div class="gen-btn-desc">영어 단어 보고 한글 뜻 쓰기 · 테스트지 + 답지</div>
        </div>
      </button>
      <button class="gen-btn gen-btn-b" onclick="generate('B')">
        <span class="gen-btn-icon">✏️</span>
        <div>
          <div>한글 → 영어 단어 쓰기</div>
          <div class="gen-btn-desc">한글 뜻 보고 영어 단어 쓰기 · 테스트지 + 답지</div>
        </div>
      </button>
      <button class="gen-btn gen-btn-c" onclick="generate('C')">
        <span class="gen-btn-icon">🔀</span>
        <div>
          <div>영어 + 한글 혼합</div>
          <div class="gen-btn-desc">홀수=영→한 / 짝수=한→영 혼합 · 테스트지 + 답지</div>
        </div>
      </button>
    </div>

  </div>

  <!-- ── RIGHT PANEL ── -->
  <div class="right-panel" id="rightPanel">
    <div class="preview-placeholder" id="previewPlaceholder">
      <div class="icon">📄</div>
      <p>왼쪽에서 단어를 입력하고<br>버튼을 눌러 테스트지를 생성하세요</p>
    </div>

    <div class="print-toolbar" id="printToolbar">
      <button class="print-btn print-btn-main" onclick="printOnly('test')">🖨️ 문제지 인쇄</button>
      <button class="print-btn print-btn-answer" onclick="printOnly('answer')">🖨️ 정답지 인쇄</button>
      <button class="print-btn print-btn-main" onclick="printOnly('both')" style="background:#444">🖨️ 전체 인쇄</button>
      <button class="print-btn print-btn-clear" onclick="clearPreview()">✕ 지우기</button>
      <div class="print-info">여백=최소 권장</div>
    </div>

    <div id="sheetsContainer"></div>
  </div>

</div>

<script>
// ── 상태 ──────────────────────────────────────────
let words = [];
let logoDataURL = null;
let currentDayKey = null; // 현재 편집 중인 저장 키

// ── 단어장 저장/불러오기 ──────────────────────────────
// ── JSONBin 클라우드 동기화 ──────────────────────────
const JSONBIN_KEY = '$2a$10$yG2rOIbC7zLa7jxsRhKLVujozCfZirqEjLmQ3fA4OHn8QmjVFfr4a';
const JSONBIN_BASE = 'https://api.jsonbin.io/v3';
let binId = localStorage.getItem('jsonbin_bin_id') || '6a0c311a6610dd3ae86c6e96';
let isSyncing = false;

function showSyncStatus(msg, color='#7a7268') {
  let el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color;
}

async function cloudSave(data) {
  isSyncing = true;
  showSyncStatus('☁️ 저장 중...', '#1a3a7a');
  try {
    const id = binId || '6a0c311a6610dd3ae86c6e96';
    binId = id;
    localStorage.setItem('jsonbin_bin_id', id);

    const res = await fetch('https://api.jsonbin.io/v3/b/' + id, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + JSON.stringify(json));

    showSyncStatus('✓ 클라우드 저장됨', '#2d5a27');
    setTimeout(() => showSyncStatus('☁️ 동기화됨', '#2d5a27'), 2000);
  } catch(e) {
    console.error('cloudSave:', e);
    showSyncStatus('⚠ 저장 실패: ' + e.message, '#8a1a1a');
  }
  isSyncing = false;
}

async function cloudLoad() {
  showSyncStatus('☁️ 불러오는 중...', '#1a3a7a');
  try {
    const id = binId || '6a0c311a6610dd3ae86c6e96';
    binId = id;
    localStorage.setItem('jsonbin_bin_id', id);

    const res = await fetch('https://api.jsonbin.io/v3/b/' + id + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const json = await res.json();
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = json.record || json;
    if (data?.wordlists) localStorage.setItem('wordlists', JSON.stringify(data.wordlists));
    if (data?.booknames) localStorage.setItem('booknames', JSON.stringify(data.booknames));

    showSyncStatus('✓ 불러오기 완료', '#2d5a27');
    setTimeout(() => showSyncStatus('☁️ 동기화됨', '#2d5a27'), 2000);
    renderSavedList();
    renderBookTags();
  } catch(e) {
    console.error('cloudLoad:', e);
    showSyncStatus('⚠ 불러오기 실패: ' + e.message, '#8a1a1a');
  }
}
function getCloudData() {
  return {
    wordlists: getSavedLists(),
    booknames: getSavedBooks()
  };
}

function getSavedLists() {
  try { return JSON.parse(localStorage.getItem('wordlists') || '{}'); } catch { return {}; }
}

function saveWordList() {
  const dayNum = document.getElementById('unitName').value.trim();
  if (!dayNum) { alert('DAY 번호를 먼저 입력해주세요.'); return; }
  const valid = shuffle(words.filter(w => w.eng && w.kor));
  if (valid.length === 0) { alert('저장할 단어가 없습니다.'); return; }
  showSaveFolderModal(dayNum, valid);
}

function showSaveFolderModal(dayNum, valid) {
  const exist = document.getElementById('saveFolderModal');
  if (exist) exist.remove();

  const lists = getSavedLists();
  const books = getSavedBooks();
  const existingFolders = [...new Set([
    ...Object.values(lists).map(d => d.book).filter(Boolean),
    ...books
  ])].sort();
  const currentBook = document.getElementById('bookName').value.trim();

  const overlay = document.createElement('div');
  overlay.id = 'saveFolderModal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;';

  const modal = document.createElement('div');
  modal.style.cssText = 'background:#faf8f5;border-radius:14px;padding:24px;width:340px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 40px rgba(0,0,0,0.2);';

  modal.innerHTML = `
    <div style="font-size:16px;font-weight:900;color:#1a1714;">저장할 폴더 선택</div>
    <div style="font-size:12px;color:#7a7268;">DAY ${dayNum} &middot; ${valid.length}개 단어</div>
    <div id="folderOptionList" style="display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;"></div>
    <div style="border-top:1px solid #e0dbd3;padding-top:12px;">
      <div style="font-size:11px;font-weight:700;color:#7a7268;margin-bottom:6px;">새 폴더 만들기</div>
      <div style="display:flex;gap:8px;">
        <input id="newFolderInput" type="text" placeholder="교재명 입력"
          style="flex:1;border:1px solid #d6d0c8;border-radius:7px;padding:8px 10px;font-family:'Pretendard',sans-serif;font-size:13px;background:#f0ede8;outline:none;">
        <button id="newFolderSaveBtn"
          style="padding:8px 14px;background:#1a1714;color:#fff;border:none;border-radius:7px;font-family:'Pretendard',sans-serif;font-size:13px;font-weight:700;cursor:pointer;">저장</button>
      </div>
    </div>
    <button id="cancelSaveBtn"
      style="padding:9px;background:transparent;border:1px solid #d6d0c8;border-radius:7px;font-family:'Pretendard',sans-serif;font-size:13px;color:#7a7268;cursor:pointer;">취소</button>
  `;

  // 기존 폴더 버튼
  const listEl = modal.querySelector('#folderOptionList');
  if (existingFolders.length === 0) {
    listEl.innerHTML = '<div style="font-size:12px;color:#aaa;text-align:center;padding:8px">저장된 폴더가 없습니다</div>';
  } else {
    existingFolders.forEach(folder => {
      const isSelected = folder === currentBook;
      const btn = document.createElement('button');
      btn.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1.5px solid ' +
        (isSelected ? '#1a1714' : '#e0dbd3') + ';background:' + (isSelected ? '#1a1714' : '#fff') +
        ';color:' + (isSelected ? '#fff' : '#1a1714') +
        ';font-family:"Pretendard",sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;width:100%;';
      btn.innerHTML = '<span>' + (isSelected ? '📂' : '📁') + '</span><span style="flex:1">' + folder + '</span>' +
        (isSelected ? '<span style="font-size:11px;opacity:0.7">현재</span>' : '');
      btn.onmouseover = () => { if (!isSelected) { btn.style.background = '#f0ede8'; btn.style.borderColor = '#b0a898'; } };
      btn.onmouseout  = () => { if (!isSelected) { btn.style.background = '#fff';    btn.style.borderColor = '#e0dbd3'; } };
      btn.onclick = () => confirmSave(folder, dayNum, valid);
      listEl.appendChild(btn);
    });
  }

  // 새 폴더 기본값
  modal.querySelector('#newFolderInput').value = (currentBook && !existingFolders.includes(currentBook)) ? currentBook : '';
  modal.querySelector('#newFolderSaveBtn').onclick = () => {
    confirmSave(null, dayNum, valid);
  };
  modal.querySelector('#cancelSaveBtn').onclick = () => overlay.remove();

  overlay.appendChild(modal);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function confirmSave(folder, dayNum, valid) {
  let book = folder;
  if (!book) {
    const inp = document.getElementById('newFolderInput');
    book = inp ? inp.value.trim() : '';
    if (!book) book = '미분류';
  }
  const key = 'DAY ' + dayNum;
  const lists = getSavedLists();
  lists[key] = { day: dayNum, words: valid, book: book, savedAt: new Date().toISOString() };
  localStorage.setItem('wordlists', JSON.stringify(lists));

  document.getElementById('bookName').value = book;
  const bks = getSavedBooks();
  if (!bks.includes(book)) { bks.unshift(book); localStorage.setItem('booknames', JSON.stringify(bks)); }

  currentDayKey = key;
  renderSavedList();
  renderBookTags();
  cloudSave(getCloudData());

  const modal = document.getElementById('saveFolderModal');
  if (modal) modal.remove();

  const btn = document.querySelector('[onclick="saveWordList()"]');
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ 저장됨';
    btn.style.background = '#2d5a27';
    setTimeout(() => { btn.textContent = orig; btn.style.background = 'var(--ink)'; }, 1500);
  }
}



function loadWordList(key) {
  const lists = getSavedLists();
  const data = lists[key];
  if (!data) return;
  currentDayKey = key;

  // DAY 번호 세팅
  document.getElementById('unitName').value = data.day;

  // 단어 행 초기화 후 로드
  const wrap = document.getElementById('wordTableWrap');
  const addBtn = wrap.querySelector('.add-row-btn');
  wrap.querySelectorAll('.word-row').forEach(r => r.remove());

  data.words.forEach((w, i) => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <div class="word-num">${String(i+1).padStart(2,'0')}</div>
      <input class="word-input" type="text" placeholder="English" value="${escHtml(w.eng)}" oninput="syncWords()">
      <input class="word-input" type="text" placeholder="한글 뜻" value="${escHtml(w.kor)}" oninput="syncWords()">
      <button class="del-btn" onclick="deleteRow(this)" title="삭제">✕</button>
    `;
    wrap.insertBefore(row, addBtn);
  });
  syncWords();
  renderSavedList();
  clearPreview();
}

function deleteWordList(key, e) {
  e.stopPropagation();
  if (!confirm(`"${key}" 단어장을 삭제할까요?`)) return;
  const lists = getSavedLists();
  delete lists[key];
  localStorage.setItem('wordlists', JSON.stringify(lists));
  if (currentDayKey === key) currentDayKey = null;
  renderSavedList();
}

function newWordList() {
  currentDayKey = null;
  document.getElementById('unitName').value = '';
  const wrap = document.getElementById('wordTableWrap');
  const addBtn = wrap.querySelector('.add-row-btn');
  wrap.querySelectorAll('.word-row').forEach(r => r.remove());
  for (let i = 0; i < 10; i++) addRow(false);
  syncWords();
  renderSavedList();
  clearPreview();
}

// ── 교재명 저장/관리 ──────────────────────────────
function getSavedBooks() {
  try { return JSON.parse(localStorage.getItem('booknames') || '[]'); } catch { return []; }
}

function saveBookName() {
  const name = document.getElementById('bookName').value.trim();
  if (!name) { alert('교재명을 입력해주세요.'); return; }
  const books = getSavedBooks();
  if (!books.includes(name)) {
    books.unshift(name);
    localStorage.setItem('booknames', JSON.stringify(books));
  }
  renderBookTags();
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = '✓';
  btn.style.background = '#2d5a27';
  setTimeout(() => { btn.textContent = orig; btn.style.background = 'var(--ink)'; }, 1200);
}

function deleteBook(name) {
  const books = getSavedBooks().filter(b => b !== name);
  localStorage.setItem('booknames', JSON.stringify(books));
  renderBookTags();
}

function selectBook(name) {
  document.getElementById('bookName').value = name;
  // 선택된 태그 강조
  document.querySelectorAll('.book-tag').forEach(t => {
    t.style.background = t.dataset.name === name ? '#1a1714' : '#f0ede8';
    t.style.color = t.dataset.name === name ? '#fff' : '#1a1714';
    t.style.borderColor = t.dataset.name === name ? '#1a1714' : '#d6d0c8';
  });
}

function renderBookTags() {
  const books = getSavedBooks();
  const dl = document.getElementById('bookList');
  const wrap = document.getElementById('savedBookTags');
  if (!dl || !wrap) return;

  // datalist 업데이트
  dl.innerHTML = books.map(b => `<option value="${b}">`).join('');

  // 태그 UI
  if (books.length === 0) { wrap.innerHTML = ''; return; }

  const current = document.getElementById('bookName').value.trim();
  wrap.innerHTML = books.map(b => `
    <span class="book-tag" data-name="${b}" onclick="selectBook('${b.replace(/'/g,"\'")}')"
      style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 10px;
      border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;
      font-family:'Pretendard',sans-serif;transition:all 0.15s;
      background:${b===current?'#1a1714':'#f0ede8'};
      color:${b===current?'#fff':'#1a1714'};
      border-color:${b===current?'#1a1714':'#d6d0c8'}">
      ${b}
      <span onclick="event.stopPropagation();deleteBook('${b.replace(/'/g,"\'")}')"
        style="margin-left:2px;opacity:0.5;font-size:10px;cursor:pointer;hover:opacity:1">✕</span>
    </span>
  `).join('');
}

function onBookInput() { renderBookTags(); }
function onBookChange() { renderBookTags(); }

function renderSavedList() {
  const lists = getSavedLists();
  const container = document.getElementById('savedList');
  const empty = document.getElementById('savedEmpty');
  container.querySelectorAll('.folder-item, .saved-item').forEach(el => el.remove());

  // 교재명별 그룹핑
  const groups = {};
  Object.keys(lists).forEach(key => {
    const data = lists[key];
    const book = data.book || '미분류';
    if (!groups[book]) groups[book] = [];
    groups[book].push({ key, data });
  });

  const bookNames = Object.keys(groups).sort();
  if (bookNames.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  bookNames.forEach(book => {
    const items = groups[book].sort((a,b) => parseInt(a.data.day) - parseInt(b.data.day));
    const isOpen = localStorage.getItem('folder_' + book) !== 'closed';

    const folderEl = document.createElement('div');
    folderEl.className = 'folder-item';

    const header = document.createElement('div');
    header.className = 'folder-header';
    header.innerHTML = `
      <span class="folder-arrow ${isOpen ? 'open' : ''}">▶</span>
      <span class="folder-icon">${isOpen ? '📂' : '📁'}</span>
      <span class="folder-name" title="${book}">${book}</span>
      <span class="folder-count">${items.length}</span>
      <button class="folder-del" title="폴더 삭제">✕</button>
    `;

    const children = document.createElement('div');
    children.className = 'folder-children' + (isOpen ? ' open' : '');

    // 폴더 토글
    header.querySelector('.folder-arrow').addEventListener('click', e => {
      e.stopPropagation();
      toggleFolder(book, header, children);
    });
    header.querySelector('.folder-icon').addEventListener('click', e => {
      e.stopPropagation();
      toggleFolder(book, header, children);
    });
    header.querySelector('.folder-name').addEventListener('click', e => {
      e.stopPropagation();
      toggleFolder(book, header, children);
    });
    header.querySelector('.folder-count').addEventListener('click', e => {
      e.stopPropagation();
      toggleFolder(book, header, children);
    });

    // 폴더 삭제
    header.querySelector('.folder-del').addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm(`"${book}" 폴더와 모든 단어장을 삭제할까요?`)) return;
      const ls = getSavedLists();
      items.forEach(({ key }) => delete ls[key]);
      localStorage.setItem('wordlists', JSON.stringify(ls));
      renderSavedList();
    });

    // DAY 아이템들
    items.forEach(({ key, data }) => {
      const item = document.createElement('div');
      item.className = 'saved-item' + (key === currentDayKey ? ' active' : '');
      item.innerHTML = `
        <span class="saved-item-day">DAY ${data.day}</span>
        <span class="saved-item-count">${data.words.length}개</span>
        <button class="saved-item-del" title="삭제">✕</button>
      `;
      item.querySelector('.saved-item-del').addEventListener('click', e => deleteWordList(key, e));
      item.addEventListener('click', () => loadWordList(key));
      children.appendChild(item);
    });

    folderEl.appendChild(header);
    folderEl.appendChild(children);
    container.insertBefore(folderEl, document.getElementById('savedEmpty'));
  });
}

function toggleFolder(book, header, children) {
  const isOpen = children.classList.contains('open');
  if (isOpen) {
    children.classList.remove('open');
    header.querySelector('.folder-arrow').classList.remove('open');
    header.querySelector('.folder-icon').textContent = '📁';
    localStorage.setItem('folder_' + book, 'closed');
  } else {
    children.classList.add('open');
    header.querySelector('.folder-arrow').classList.add('open');
    header.querySelector('.folder-icon').textContent = '📂';
    localStorage.removeItem('folder_' + book);
  }
}


function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── localStorage 저장/로드 ──────────────────────────
function saveInfo() {
  const name = document.getElementById('academyName').value.trim();
  if (!name && !logoDataURL) { alert('학원명 또는 로고를 입력해주세요.'); return; }
  localStorage.setItem('academy_name', name);
  if (logoDataURL) localStorage.setItem('academy_logo', logoDataURL);
  showRegistered();
}

function loadInfo() {
  const name = localStorage.getItem('academy_name');
  const logo = localStorage.getItem('academy_logo');
  if (name || logo) {
    if (name) document.getElementById('academyName').value = name;
    if (logo) {
      logoDataURL = logo;
      document.getElementById('logoPreview').src = logo;
      document.getElementById('logoPreview').style.display = 'block';
      document.getElementById('logoPlaceholder').style.display = 'none';
    }
    showRegistered();
  }
}

function showRegistered() {
  const name = localStorage.getItem('academy_name') || '';
  const logo = localStorage.getItem('academy_logo') || '';
  document.getElementById('infoRegistered').style.display = 'flex';
  document.getElementById('infoEdit').style.display = 'none';
  document.getElementById('editInfoBtn').style.display = 'inline-block';
  if (logo) { document.getElementById('logoRegistered').src = logo; document.getElementById('logoRegistered').style.display = 'block'; }
  else { document.getElementById('logoRegistered').style.display = 'none'; }
  document.getElementById('academyRegisteredName').textContent = name;
}

function toggleEditMode() {
  const edit = document.getElementById('infoEdit');
  const reg  = document.getElementById('infoRegistered');
  if (edit.style.display === 'none') {
    edit.style.display = 'block';
    reg.style.display = 'none';
    document.getElementById('editInfoBtn').textContent = '✕ 취소';
  } else {
    edit.style.display = 'none';
    reg.style.display = 'flex';
    document.getElementById('editInfoBtn').textContent = '✏️ 편집';
  }
}

function addRow(focus = true) {
  const wrap = document.getElementById('wordTableWrap');
  const addBtn = wrap.querySelector('.add-row-btn');
  const idx = wrap.querySelectorAll('.word-row').length + 1;
  const row = document.createElement('div');
  row.className = 'word-row';
  row.innerHTML = `
    <div class="word-num">${String(idx).padStart(2,'0')}</div>
    <input class="word-input" type="text" placeholder="English" oninput="syncWords()">
    <input class="word-input" type="text" placeholder="한글 뜻" oninput="syncWords()">
    <button class="del-btn" onclick="deleteRow(this)" title="삭제">✕</button>
  `;
  wrap.insertBefore(row, addBtn);
  if (focus) row.querySelector('input').focus();
  syncWords();
}

function deleteRow(btn) {
  const row = btn.closest('.word-row');
  row.remove();
  // 번호 재정렬
  document.querySelectorAll('.word-row').forEach((r, i) => {
    r.querySelector('.word-num').textContent = String(i+1).padStart(2,'0');
  });
  syncWords();
}

function syncWords() {
  words = [];
  document.querySelectorAll('.word-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const eng = inputs[0].value.trim();
    const kor = inputs[1].value.trim();
    if (eng || kor) words.push({ eng, kor });
  });
  updateCount();
}

function updateCount() {
  const valid = words.filter(w => w.eng && w.kor).length;
  document.getElementById('wordCount').textContent = valid;
}

function handleLogo(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    logoDataURL = ev.target.result;
    const preview = document.getElementById('logoPreview');
    preview.src = logoDataURL;
    preview.style.display = 'block';
    document.getElementById('logoPlaceholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

// generate()에서 학원명을 localStorage에서 읽도록 academyName 보완
function getAcademyName() {
  return document.getElementById('academyName').value.trim() || localStorage.getItem('academy_name') || '';
}

// ── 생성 ──────────────────────────────────────────
function generate(type) {
  const valid = shuffle(words.filter(w => w.eng && w.kor));
  if (valid.length === 0) {
    alert('영어 단어와 한글 뜻을 입력해주세요.');
    return;
  }

  const academy = getAcademyName();
  const bookName = document.getElementById('bookName').value.trim();
  const unitRaw = document.getElementById('unitName').value.trim();
  const unit    = unitRaw ? `DAY ${unitRaw}` : '';
  const today   = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});

  document.getElementById('previewPlaceholder').style.display = 'none';
  document.getElementById('printToolbar').classList.add('visible');

  const container = document.getElementById('sheetsContainer');
  container.innerHTML = '';

  const typeLabels = { A:'영어→한글', B:'한글→영어', C:'혼합' };
  const typeColors = { A:'#111111', B:'#111111', C:'#111111' };

  // 테스트지
  container.appendChild(makeSheetWrap(
    `${typeLabels[type]} 테스트지`,
    makeSheet(valid, type, false, academy, unit, today, typeColors[type], bookName)
  ));

  // 답지
  container.appendChild(makeSheetWrap(
    `${typeLabels[type]} 답지`,
    makeSheet(valid, type, true, academy, unit, today, typeColors[type], bookName)
  ));

  document.getElementById('rightPanel').scrollTop = 0;
}

function makeSheetWrap(label, sheetEl) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  const lbl = document.createElement('div');
  lbl.className = 'sheet-label';
  lbl.textContent = label;
  wrap.appendChild(lbl);
  wrap.appendChild(sheetEl);
  return wrap;
}

function makeSheet(words, type, isAnswer, academy, unit, today, accentColor, bookName) {
  const sheet = document.createElement('div');
  sheet.className = 'a4-sheet';

  const typeTitle = { A:'영어 단어 테스트', B:'한글 뜻 테스트', C:'혼합 테스트' };

  // 헤더
  const hdr = document.createElement('div');
  hdr.className = 'sheet-header';
  hdr.style.borderBottomColor = accentColor;

  const hdrLeft = document.createElement('div');
  hdrLeft.className = 'sheet-header-left';

  const currentLogo = logoDataURL || localStorage.getItem('academy_logo') || null;
  if (currentLogo) {
    const logo = document.createElement('img');
    logo.className = 'sheet-logo';
    logo.src = currentLogo;
    logo.style.display = 'block';
    hdrLeft.appendChild(logo);
  }


  const title = document.createElement('div');
  title.className = 'sheet-title';
  title.style.color = accentColor;
  const dayLabel = unit ? unit : 'DAY —';
  title.innerHTML = `${dayLabel}${isAnswer ? ' <span class="answer-badge">ANSWER</span>' : ''}`;
  hdrLeft.appendChild(title);

  if (bookName) {
    const bookEl = document.createElement('div');
    bookEl.style.cssText = 'font-size:11px;color:#888;font-family:"Pretendard",sans-serif;margin-top:2px;letter-spacing:0.2px;';
    bookEl.textContent = bookName;
    hdrLeft.appendChild(bookEl);
  }





  const hdrRight = document.createElement('div');
  hdrRight.className = 'sheet-meta';
  hdrRight.innerHTML = `
    <div class="sheet-meta-row">이름 <span>&nbsp;</span></div>
    <div class="sheet-meta-row">날짜 <span>${today}</span></div>
    <div class="sheet-meta-row">점수 <span>&nbsp;</span></div>
    <div class="sheet-meta-row" style="margin-top:6px;font-size:10px;color:#aaa">총 ${words.length}문항</div>
  `;

  hdr.appendChild(hdrLeft);
  hdr.appendChild(hdrRight);
  sheet.appendChild(hdr);

  // 테이블
  const table = document.createElement('table');
  table.className = 'word-sheet-table';

  // 헤더행
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');

  let cols = [];
  if (type === 'A') cols = ['No.', '영어 단어', isAnswer ? '정답' : '뜻 쓰기'];
  if (type === 'B') cols = ['No.', '한글 뜻', isAnswer ? '정답' : '단어 쓰기'];
  if (type === 'C') cols = ['No.', '문제', isAnswer ? '정답' : '답 쓰기'];

  cols.forEach(col => {
    const th = document.createElement('th');
    th.textContent = col;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  words.forEach((w, i) => {
    const tr = document.createElement('tr');
    const num = i + 1;

    const tdNum = document.createElement('td');
    tdNum.textContent = String(num).padStart(2, '0');
    tr.appendChild(tdNum);

    if (type === 'A') {
      const tdQ = document.createElement('td');
      tdQ.className = 'col-divider';
      tdQ.textContent = w.eng;
      tdQ.style.fontFamily = "'DM Mono', monospace";
      tdQ.style.fontWeight = '500';
      tr.appendChild(tdQ);

      const tdA = document.createElement('td');
      if (isAnswer) {
        tdA.className = 'answer';
        tdA.textContent = w.kor;
      } else {
        const line = document.createElement('div');
        line.className = 'write-line';
        tdA.appendChild(line);
      }
      tr.appendChild(tdA);

    } else if (type === 'B') {
      const tdQ = document.createElement('td');
      tdQ.className = 'col-divider';
      tdQ.textContent = w.kor;
      tr.appendChild(tdQ);

      const tdA = document.createElement('td');
      if (isAnswer) {
        tdA.className = 'answer';
        tdA.textContent = w.eng;
        tdA.style.fontFamily = "'DM Mono', monospace";
      } else {
        const line = document.createElement('div');
        line.className = 'write-line';
        tdA.appendChild(line);
      }
      tr.appendChild(tdA);

    } else if (type === 'C') {
      const isEng = num % 2 === 1;

      const tdQ = document.createElement('td');
      tdQ.className = 'col-divider';
      tdQ.textContent = isEng ? w.eng : w.kor;
      if (isEng) { tdQ.style.fontFamily = "'DM Mono', monospace"; tdQ.style.fontWeight = '500'; }
      tr.appendChild(tdQ);

      const tdA = document.createElement('td');
      if (isAnswer) {
        tdA.className = 'answer';
        tdA.textContent = isEng ? w.kor : w.eng;
        if (!isEng) tdA.style.fontFamily = "'DM Mono', monospace";
      } else {
        const line = document.createElement('div');
        line.className = 'write-line';
        tdA.appendChild(line);
      }
      tr.appendChild(tdA);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  sheet.appendChild(table);
  return sheet;
}

function printOnly(mode) {
  // mode: 'test' | 'answer' | 'both'
  const wraps = document.querySelectorAll('#sheetsContainer .sheet-wrap');
  // sheet-wrap 순서: 0=테스트지, 1=답지 (generate에서 이 순서로 추가)
  wraps.forEach((wrap, i) => {
    if (mode === 'both') {
      wrap.style.display = '';
    } else if (mode === 'test') {
      wrap.style.display = i % 2 === 0 ? '' : 'none';
    } else if (mode === 'answer') {
      wrap.style.display = i % 2 === 1 ? '' : 'none';
    }
  });
  window.print();
  // 인쇄 후 복원
  setTimeout(() => wraps.forEach(w => w.style.display = ''), 1000);
}

function clearPreview() {
  document.getElementById('sheetsContainer').innerHTML = '';
  document.getElementById('previewPlaceholder').style.display = 'flex';
  document.getElementById('printToolbar').classList.remove('visible');
}
</script>
</body>
